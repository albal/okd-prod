# Helm values for hashicorp/vault on okd.dev (okd-prod).
# Deployed by Argo CD Application "vault" (clusters/okd-prod/vault-application.yaml).
global:
  openshift: true

injector:
  enabled: true

server:
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: ocs-storagecluster-ceph-rbd

  route:
    enabled: true
    activeService: true
    host: vault.apps.okd.dev.tsew.net
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

ui:
  enabled: true
