# Authorized SSH keys for the `core` user on every node.
# Source: https://github.com/albal.keys (fetched 2026-08-15)
# Refresh with:
#   curl -sS https://github.com/albal.keys | awk '{print "            - "$1" "$2}'
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-master-ssh-albal
spec:
  config:
    ignition:
      version: 3.2.0
    passwd:
      users:
        - name: core
          sshAuthorizedKeys:
            - ssh-rsa 
            - ssh-rsa 
            - ssh-rsa 
            - ssh-rsa 
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIWotXS85lArDMh2G+Is+/dSvLGZpzRu9xx8VH70HR5N
            - ssh-rsa 
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII5pwzYZanBSGxVQ4tOodBX7Mrn1YP+bgyPje8Qc4mZS
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-ssh-albal
spec:
  config:
    ignition:
      version: 3.2.0
    passwd:
      users:
        - name: core
          sshAuthorizedKeys:
            - ssh-rsa 
            - ssh-rsa 
            - ssh-rsa 
            - ssh-rsa 
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIWotXS85lArDMh2G+Is+/dSvLGZpzRu9xx8VH70HR5N
            - ssh-rsa 
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII5pwzYZanBSGxVQ4tOodBX7Mrn1YP+bgyPje8Qc4mZS
