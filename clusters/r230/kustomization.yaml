apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Explicitly including everything ensures you don't miss anything
# and gives you control over the order if necessary.
resources:
  - operatorhub.yaml
  - node-labels.yaml
  - cert-manager-operator.yaml
  - ClusterIssuer.yaml
  - certs.yaml
  - cert-manager-config.yaml
  - console-plugins.yaml
  - MachineConfigs.yaml
  - ssh-keys.yaml
  - kubevirt-operator.yaml
  - longhorn-storage.yaml
